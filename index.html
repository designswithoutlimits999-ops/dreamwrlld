<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DreamWrlld Graphix</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
  <!-- EmailJS Script -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <style>
    body {
      font-family: 'Montserrat', sans-serif;
      background-color: #0a0a0a;
      color: #ffffff;
    }
    .brutal-border {
      border: 4px solid #ffffff;
      box-shadow: 8px 8px 0px #00ffcc;
      transition: all 0.2s ease-in-out;
    }
    .brutal-border:hover {
      transform: translate(4px, 4px);
      box-shadow: 4px 4px 0px #00ffcc;
    }
    .chat-container {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 350px;
      max-width: calc(100vw - 40px);
      background: #111;
      border: 2px solid #fff;
      box-shadow: 6px 6px 0px #ff00ff;
      display: flex;
      flex-direction: column;
      height: 450px;
    }
    .chat-box {
      flex-grow: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg-bot {
      align-self: flex-start;
      background: #333;
      padding: 8px 12px;
      border-left: 4px solid #00ffcc;
    }
    .msg-user {
      align-self: flex-end;
      background: #ff00ff;
      color: #fff;
      padding: 8px 12px;
      border-right: 4px solid #fff;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center p-8">

  <!-- Header -->
  <header class="w-full max-w-4xl mb-12 text-center">
    <h1 class="text-5xl md:text-7xl font-black uppercase tracking-tighter mb-4 text-transparent bg-clip-text bg-gradient-to-r from-[#00ffcc] to-[#ff00ff]">DreamWrlld Graphix</h1>
    <p class="text-xl font-bold tracking-widest uppercase">Visual Design & UX/UI</p>
  </header>

  <!-- 2-Column Gallery Container -->
  <main class="w-full max-w-4xl grid grid-cols-1 md:grid-cols-2 gap-8 mb-24">
    <div class="brutal-border bg-gray-900 aspect-video flex items-center justify-center">
      <p class="font-bold tracking-widest text-gray-500">PROJECT 1</p>
    </div>
    <div class="brutal-border bg-gray-900 aspect-video flex items-center justify-center">
      <p class="font-bold tracking-widest text-gray-500">PROJECT 2</p>
    </div>
    <div class="brutal-border bg-gray-900 aspect-video flex items-center justify-center">
      <p class="font-bold tracking-widest text-gray-500">PROJECT 3</p>
    </div>
    <div class="brutal-border bg-gray-900 aspect-video flex items-center justify-center">
      <p class="font-bold tracking-widest text-gray-500">PROJECT 4</p>
    </div>
  </main>

  <!-- Chatbot UI -->
  <div class="chat-container">
    <div class="bg-white text-black p-3 font-bold border-b-2 border-black flex justify-between">
      <span>TASK BOT</span>
      <span class="text-xs self-center bg-black text-white px-2 py-1 uppercase">Online</span>
    </div>
    <div id="chatBox" class="chat-box text-sm">
      <div class="msg-bot">System initialized. Welcome to DreamWrlld Graphix. I am the Task Bot. What is your name?</div>
    </div>
    <div class="border-t-2 border-white flex p-2 bg-black">
      <input id="chatInput" type="text" class="flex-grow bg-transparent text-white outline-none p-2 placeholder-gray-500" placeholder="Type your answer...">
      <button id="chatSubmit" class="bg-white text-black font-bold px-4 py-2 hover:bg-[#00ffcc] transition-colors">SEND</button>
    </div>
  </div>

  <script>
    emailjs.init("Cxf1kmjkVg5P31DVM");

    const chatBox = document.getElementById("chatBox");
    const chatInput = document.getElementById("chatInput");
    const chatSubmit = document.getElementById("chatSubmit");

    let step = 0;
    const clientData = {
      name: "",
      email: "",
      projectType: "",
      timeline: ""
    };

    function botSpeak(text) {
      const div = document.createElement("div");
      div.className = "msg-bot";
      div.innerText = text;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function userSpeak(text) {
      const div = document.createElement("div");
      div.className = "msg-user";
      div.innerText = text;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function handleInput() {
      const text = chatInput.value.trim();
      if (!text) return;

      userSpeak(text);
      chatInput.value = "";

      setTimeout(() => {
        switch (step) {
          case 0:
            clientData.name = text;
            botSpeak(`Acknowledged, ${clientData.name}. What is the best email address to reach you at?`);
            break;
          case 1:
            clientData.email = text;
            botSpeak("Email logged. What type of project do you need? (e.g., Logo, Web Design, Branding)");
            break;
          case 2:
            clientData.projectType = text;
            botSpeak("Excellent. Finally, what is your estimated timeline or deadline for this project?");
            break;
          case 3:
            clientData.timeline = text;
            botSpeak("Processing your request...");
            
            setTimeout(() => {
              botSpeak(`INTAKE COMPLETE. Thank you, ${clientData.name}.`);
              
              setTimeout(() => {
                botSpeak(`Tim will review your request for a ${clientData.projectType} and will email you at ${clientData.email} within 24 hours.`);
                
                chatInput.disabled = true;
                chatInput.placeholder = "Session ended.";
                
                emailjs.send("service_qgdxdxk", "template_xnmkods", {
                  name: clientData.name,
                  email: clientData.email,
                  project: clientData.projectType,
                  timeline: clientData.timeline
                }).then(function(response) {
                  console.log("Success!", response.status);
                }, function(error) {
                  console.log("Failed", error);
                });
                
              }, 1500);
            }, 1000);
            break;
        }
        step++;
      }, 500); 
    }

    chatSubmit.addEventListener("click", handleInput);
    chatInput.addEventListener("keypress", function(e) {
      if (e.key === "Enter") {
        handleInput();
      }
    });
  </script>
</body>
</html>
